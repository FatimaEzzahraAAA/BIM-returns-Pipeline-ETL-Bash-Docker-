services:
  processor:
    build: .
    image: bim-returns:1.0
    volumes:
      - ./:/app
    restart: "no"

  viewer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./output:/var/www/output:ro
      - ./viewer/index.html:/usr/share/nginx/html/index.html:ro
      - ./viewer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - processor